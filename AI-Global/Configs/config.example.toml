# AI-Articles-Tools 配置示例
# 复制为 config.toml 并填入你的密钥；环境变量（ARTICLES_LLM_API_KEY 等）优先级更高。
# 所有 *API 均兼容 OpenAI 协议，可指向 DeepSeek / SiliconFlow / 通义 / 本地模型等。

[llm]
base_url = "https://api.openai.com/v1"
api_key = "sk-xxxxxx"
model = "gpt-4o-mini"
temperature = 0.85

[image]
base_url = "https://api.openai.com/v1"
api_key = "sk-xxxxxx"
model = "gpt-image-1"

[asr]                       # 视频口播转写（语音识别）
base_url = "https://api.openai.com/v1"
api_key = "sk-xxxxxx"
model = "whisper-1"

[paths]
db = "AI-Global/Database/ai_articles.db"   # 数据库文件（全局共享，置于 AI-Global/Database/）
articles_dir = "Articles"   # 采集结果存放（本分类目录内）
out_dir = "OutArticles"     # 二创结果存放（本分类目录内）

[app]
provider = "openai"         # openai | mock（mock 可离线跑通全流程）
